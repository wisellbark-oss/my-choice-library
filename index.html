<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#131211"><meta name="description" content="把已经验证过的好选择留在这里。"><link rel="manifest" href="./app.webmanifest"><link rel="icon" href="./icon.svg"><title>我的选择库</title><style>:root{--bg:#131211;--card:#1b1917;--soft:#23201d;--line:#302c28;--text:#f4efe8;--muted:#aaa39a;--gold:#d9a45b;--danger:#e6847a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:720px;margin:auto;padding:18px 16px 96px}.top{display:flex;align-items:flex-start;gap:10px}.top .grow{flex:1}.top h1{margin:0;font-size:25px}.sub{color:var(--muted);font-size:13px;margin-top:7px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}.search{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);padding:14px 0}.search input,.field{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);padding:13px 14px;outline:none}.search input{height:50px}.section{margin-top:22px}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.head h2{font-size:17px;margin:0}.meta{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{min-height:98px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px;text-align:left;color:var(--text)}.cat b{display:block;margin-top:14px;font-size:14px}.cat small{color:var(--muted)}.dot{width:32px;height:32px;border-radius:10px;background:rgba(217,164,91,.14);display:grid;place-items:center;color:var(--gold)}.list{display:grid;gap:10px}.item{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px}.row{display:flex;gap:10px;align-items:flex-start}.grow{flex:1}.item h3{margin:0;font-size:16px}.path{font-size:12px;color:var(--gold);margin-top:5px}.note{font-size:13px;color:var(--muted);line-height:1.55;margin-top:7px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:11px;color:#c8c1b8;background:#26231f;border:1px solid #34302b;border-radius:999px;padding:4px 8px}.star{border:0;background:none;color:var(--gold);font-size:20px}.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:24px;width:58px;height:58px;border:0;border-radius:18px;background:var(--gold);color:#1b1510;font-size:30px}.empty{border:1px dashed #3a3530;border-radius:14px;padding:24px;text-align:center;color:var(--muted)}.sheet{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:20;display:flex;align-items:flex-end;justify-content:center}.panel{width:min(100%,720px);max-height:92vh;overflow:auto;background:#1d1a17;border:1px solid #37312c;border-radius:20px 20px 0 0;padding:18px 16px 28px}.panel h2{margin:0 0 16px}.fg{margin-top:13px}.fg label{display:block;font-size:13px;margin-bottom:6px;color:#d8d1c8}.fg textarea{min-height:88px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{min-height:47px;border-radius:12px;padding:0 14px;font-weight:650}.primary{border:0;background:var(--gold);color:#1b1510}.secondary{border:1px solid var(--line);background:var(--card);color:var(--text)}.danger{border:1px solid rgba(230,132,122,.35);background:rgba(230,132,122,.08);color:#f0a39b}.linkbtn{border:0;background:none;color:var(--gold)}.manage{display:grid;gap:8px}.manage .m{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card);padding:11px;border-radius:12px}.manage .m span{flex:1}.settings p{color:var(--muted);font-size:13px;line-height:1.6}.random{border:1px solid rgba(217,164,91,.28);background:rgba(217,164,91,.08);border-radius:14px;padding:15px;margin-top:18px}.hidden{display:none!important}@media(max-width:390px){.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="grow"><h1>我的选择库</h1><div class="sub">把已经验证过的好选择留在这里。</div></div><button class="iconbtn" id="manageBtn">☰</button><button class="iconbtn" id="settingsBtn">⚙</button></div><div class="search"><input id="q" placeholder="搜索我喜欢的东西……"></div><section class="section"><div class="head"><h2>分类</h2><span class="meta" id="catMeta"></span></div><div class="grid" id="cats"></div></section><section class="section"><div class="head"><h2>我的常用</h2><span class="meta" id="favMeta"></span></div><div class="list" id="favs"></div></section><section class="section"><button class="secondary btn" style="width:100%" id="randomBtn">今天不知道选什么？</button></section><section class="section hidden" id="searchSec"><div class="head"><h2>搜索结果</h2><span class="meta" id="searchMeta"></span></div><div class="list" id="results"></div></section></div><button class="fab" id="addBtn">＋</button><div id="modal"></div><script>const K='my-choice-library-v1';const seed={categories:[{id:'c1',name:'衣物'},{id:'c2',name:'鞋子'},{id:'c3',name:'水果'},{id:'c4',name:'吃饭'},{id:'c5',name:'咖啡'},{id:'c6',name:'奶茶/饮料'},{id:'c7',name:'零食'},{id:'c8',name:'日用品'},{id:'c9',name:'护肤/形象'},{id:'c10',name:'娱乐'},{id:'c11',name:'去处'},{id:'c12',name:'其他'}],records:[{id:'r1',name:'优衣库 AIRism 内裤',categoryId:'c1',subcategory:'内裤',brand:'优衣库',model:'AIRism',size:'L 175/100',status:'常用',favorite:true,note:'目前比较确定喜欢这个系列，以后买内衣内裤可优先直接选'},{id:'r2',name:'优衣库 AIRism 睡觉背心',categoryId:'c1',subcategory:'背心',brand:'优衣库',model:'AIRism',size:'M',scene:'睡觉',status:'常用',favorite:false,note:'睡觉时穿，觉得比较舒服'},{id:'r3',name:'马克华菲增高鞋',categoryId:'c2',subcategory:'增高鞋',brand:'马克华菲',status:'常用',favorite:true,note:'最近买过觉得比较适合自己，以后买鞋可作为优先选择之一'},{id:'r4',name:'苹果',categoryId:'c3',status:'常用',favorite:true},{id:'r5',name:'樱桃',categoryId:'c3',status:'常用',favorite:false},{id:'r6',name:'橙子',categoryId:'c3',status:'常用',favorite:false},{id:'r7',name:'和府捞面',categoryId:'c4',subcategory:'面',status:'常用',favorite:true},{id:'r8',name:'西木马华',categoryId:'c4',subcategory:'面',status:'常用',favorite:false},{id:'r9',name:'马华拉面',categoryId:'c4',subcategory:'面',status:'常用',favorite:false},{id:'r10',name:'澳门奶茶',categoryId:'c6',product:'珍珠奶茶',status:'常用',favorite:false}]};let db=JSON.parse(localStorage.getItem(K)||'null')||seed;const save=()=>localStorage.setItem(K,JSON.stringify(db));save();const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const catName=id=>db.categories.find(c=>c.id===id)?.name||'未分类';function recordCard(r){return `<div class="item" data-id="${r.id}"><div class="row"><div class="grow"><h3>${esc(r.name)}</h3><div class="path">${esc(catName(r.categoryId))}${r.subcategory?' → '+esc(r.subcategory):''}</div>${r.note?`<div class="note">${esc(r.note)}</div>`:''}<div class="chips">${r.brand?`<span class="chip">${esc(r.brand)}</span>`:''}${r.size?`<span class="chip">${esc(r.size)}</span>`:''}${r.status?`<span class="chip">${esc(r.status)}</span>`:''}</div></div><button class="star" data-star="${r.id}">${r.favorite?'★':'☆'}</button></div></div>`}function bindCards(root=document){root.querySelectorAll('.item').forEach(e=>e.onclick=x=>{if(x.target.closest('[data-star]'))return;editRecord(e.dataset.id)});root.querySelectorAll('[data-star]').forEach(b=>b.onclick=e=>{e.stopPropagation();const r=db.records.find(x=>x.id===b.dataset.star);r.favorite=!r.favorite;save();render()})}function render(){const q=$('#q').value.trim().toLowerCase();$('#cats').innerHTML=db.categories.map(c=>`<button class="cat" data-cat="${c.id}"><span class="dot">◆</span><b>${esc(c.name)}</b><small>${db.records.filter(r=>r.categoryId===c.id).length} 条</small></button>`).join('');$('#catMeta').textContent=`${db.categories.length} 个分类`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>showCategory(b.dataset.cat));const fav=db.records.filter(r=>r.favorite);$('#favs').innerHTML=fav.length?fav.map(recordCard).join(''):'<div class="empty">还没有标记常用的记录</div>';$('#favMeta').textContent=`${fav.length} 条`;bindCards($('#favs'));if(q){const rs=db.records.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q)||catName(r.categoryId).toLowerCase().includes(q));$('#searchSec').classList.remove('hidden');$('#results').innerHTML=rs.length?rs.map(recordCard).join(''):'<div class="empty">没有找到相关记录</div>';$('#searchMeta').textContent=`${rs.length} 条`;bindCards($('#results'))}else $('#searchSec').classList.add('hidden')}$('#q').oninput=render;function showCategory(id){const rs=db.records.filter(r=>r.categoryId===id);show(`<h2>${esc(catName(id))}</h2><div class="list">${rs.length?rs.map(recordCard).join(''):'<div class="empty">这里还没有记录</div>'}</div><div class="btnrow"><button class="secondary btn" data-close>关闭</button><button class="primary btn" id="addHere">＋ 添加</button></div>`);bindCards($('#modal'));$('#addHere').onclick=()=>recordForm(null,id)}function show(html){$('#modal').innerHTML=`<div class="sheet"><div class="panel">${html}</div></div>`;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close)}function close(){$('#modal').innerHTML=''}function recordForm(r={},preset=''){show(`<h2>${r.id?'编辑记录':'新增记录'}</h2><div class="fg"><label>名称 *</label><input class="field" id="name" value="${esc(r.name||'')}"></div><div class="fg"><label>分类</label><select class="field" id="cat">${db.categories.map(c=>`<option value="${c.id}" ${(r.categoryId||preset)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="twocol"><div class="fg"><label>子分类</label><input class="field" id="subcat" value="${esc(r.subcategory||'')}"></div><div class="fg"><label>品牌</label><input class="field" id="brand" value="${esc(r.brand||'')}"></div><div class="fg"><label>型号/款式</label><input class="field" id="model" value="${esc(r.model||'')}"></div><div class="fg"><label>尺码/规格</label><input class="field" id="size" value="${esc(r.size||'')}"></div><div class="fg"><label>具体产品</label><input class="field" id="product" value="${esc(r.product||'')}"></div><div class="fg"><label>使用场景</label><input class="field" id="scene" value="${esc(r.scene||'')}"></div></div><div class="fg"><label>标签</label><input class="field" id="tags" value="${esc(r.tags||'')}" placeholder="例如：舒服、回购"></div><div class="fg"><label>状态</label><select class="field" id="status"><option ${r.status==='常用'?'selected':''}>常用</option><option ${r.status==='待探索'?'selected':''}>待探索</option><option ${r.status==='暂停'?'selected':''}>暂停</option></select></div><div class="fg"><label>我的备注</label><textarea class="field" id="note">${esc(r.note||'')}</textarea></div><div class="fg"><label><input type="checkbox" id="favorite" ${r.favorite?'checked':''}> 收藏到“我的常用”</label></div><div class="btnrow"><button class="secondary btn" data-close>取消</button><button class="primary btn" id="saveRecord">保存</button></div>${r.id?'<button class="danger btn" id="deleteRecord" style="width:100%;margin-top:10px">删除这条记录</button>':''}`);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);$('#saveRecord').onclick=()=>{const name=$('#name').value.trim();if(!name)return alert('请填写名称');const n={id:r.id||'r'+Date.now(),name,categoryId:$('#cat').value,subcategory:$('#subcat').value.trim(),brand:$('#brand').value.trim(),model:$('#model').value.trim(),size:$('#size').value.trim(),product:$('#product').value.trim(),scene:$('#scene').value.trim(),tags:$('#tags').value.trim(),status:$('#status').value,favorite:$('#favorite').checked,note:$('#note').value.trim()};if(r.id)db.records=db.records.map(x=>x.id===r.id?n:x);else db.records.unshift(n);save();close();render()};if(r.id)$('#deleteRecord').onclick=()=>{if(confirm('确定删除吗？')){db.records=db.records.filter(x=>x.id!==r.id);save();close();render()}}}function editRecord(id){recordForm(db.records.find(r=>r.id===id))}function manage(){show(`<h2>分类管理</h2><div class="manage" id="manageList">${db.categories.map(c=>`<div class="m"><span>${esc(c.name)}</span><button class="secondary btn" data-rename="${c.id}">改名</button><button class="danger btn" data-delcat="${c.id}">删除</button></div>`).join('')}</div><div class="btnrow"><button class="secondary btn" data-close>关闭</button><button class="primary btn" id="newCat">＋ 新建分类</button></div>`);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);$('#newCat').onclick=()=>{const n=prompt('新分类名称');if(n?.trim()){db.categories.push({id:'c'+Date.now(),name:n.trim()});save();manage();render()}};document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{const c=db.categories.find(x=>x.id===b.dataset.rename),n=prompt('修改分类名称',c.name);if(n?.trim()){c.name=n.trim();save();manage();render()}});document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>{const id=b.dataset.delcat,c=catName(id),n=db.records.filter(r=>r.categoryId===id).length;if(confirm(`确定删除“${c}”吗？${n?`\n会同时删除其中 ${n} 条记录。`:''}`)){db.records=db.records.filter(r=>r.categoryId!==id);db.categories=db.categories.filter(c=>c.id!==id);save();manage();render()}})}function settings(){show(`<div class="settings"><h2>设置</h2><h3>数据备份</h3><p>数据保存在当前手机浏览器。建议定期导出备份，换手机或清理浏览器数据前尤其要做。</p><div class="btnrow"><button class="secondary btn" id="exportBtn">导出 JSON</button><button class="secondary btn" id="importBtn">导入 JSON</button></div><input type="file" id="file" accept="application/json,.json" class="hidden"><h3 style="margin-top:22px">关于</h3><p>我的选择库 v1.0<br>纯个人、本地保存、无需服务器。</p><button class="secondary btn" style="width:100%;margin-top:18px" data-close>关闭</button></div>`);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='我的选择库-备份.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('#importBtn').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.categories)||!Array.isArray(d.records))throw 0;if(confirm('导入会覆盖当前数据，继续吗？')){db=d;save();close();render()}}catch{alert('文件格式不正确')}}}function randomPick(){show(`<h2>今天不知道选什么？</h2><div class="fg"><label>先选一个分类</label><select class="field" id="rc"><option value="">请选择</option>${db.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div id="rr"></div><button class="secondary btn" style="width:100%;margin-top:18px" data-close>关闭</button>`);document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);$('#rc').onchange=()=>pick($('#rc').value);function pick(id){const pool=db.records.filter(r=>r.categoryId===id&&r.status==='常用');$('#rr').innerHTML=pool.length?(()=>{const r=pool[Math.floor(Math.random()*pool.length)];return `<div class="random"><div class="meta">今天可以选</div><h2>${esc(r.name)}</h2>${r.note?`<div class="note">${esc(r.note)}</div>`:''}<button class="primary btn" style="width:100%;margin-top:12px" id="again">换一个</button></div>`})():'<div class="empty" style="margin-top:14px">这个分类还没有“常用”记录</div>';if($('#again'))$('#again').onclick=()=>pick(id)}}$('#addBtn').onclick=()=>recordForm();$('#manageBtn').onclick=manage;$('#settingsBtn').onclick=settings;$('#randomBtn').onclick=randomPick;render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
